<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>h2h</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #000;
      --fg: #fff;
      --dim: #555;
      --line: #222;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #progWrap { height: 3px; background: var(--line); flex: 0 0 auto; }
    #progFill { height: 100%; width: 0%; background: var(--fg); }
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 12px 6px;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #transcript {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 16px;
      font-size: clamp(20px, 6vw, 30px);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #transcript.placeholder { color: var(--dim); font-size: clamp(12px, 3.5vw, 15px); }
    #hold {
      flex: 0 0 auto;
      height: 40vh;
      max-height: 340px;
      min-height: 160px;
      margin: 0 12px 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: clamp(28px, 9vw, 44px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    #hold:disabled { opacity: 0.3; cursor: default; }
    #hold:focus, #hold:focus-visible, #hold::-moz-focus-inner { outline: none; }
    #hold.recording { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    footer button {
      background: none;
      border: none;
      padding: 8px 0;
      color: var(--fg);
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    footer button:disabled { opacity: 0.3; cursor: default; }
    footer .right { display: flex; gap: 14px; align-items: center; }
    footer .active { color: var(--fg); }
    #playBtn.playing { color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <span>h2h</span>
    <span id="headRight">client-side</span>
  </header>
  <div id="progWrap"><div id="progFill"></div></div>
  <main>
    <div id="transcript" class="placeholder">hold to talk</div>
    <button id="hold" disabled>hold</button>
  </main>
  <footer>
    <button id="playBtn" disabled></button>
    <div class="right">
      <button id="modeBtn" disabled></button>
      <span id="threadInfo"></span>
    </div>
  </footer>

  <script src="coi-serviceworker.js"></script>
  <script>
    const MODEL_FILES = [
      { name: 'whisper-encoder.onnx', label: 'encoder' },
      { name: 'whisper-decoder.onnx.partaa', label: 'decoder 1/2' },
      { name: 'whisper-decoder.onnx.partab', label: 'decoder 2/2' },
      { name: 'tokens.txt', label: 'tokens' },
      { name: 'dpdfnet4.onnx', label: 'dpdfnet' },
    ];
    let dataCache = null;
    const progFill = document.getElementById('progFill');
    const headRight = document.getElementById('headRight');

    function fetchWithProgress(url) {
      return new Promise((resolve, reject) => {
        fetch(url).then(resp => {
          if (!resp.ok) { reject(new Error('HTTP ' + resp.status + ' for ' + url)); return; }
          const total = Number(resp.headers.get('Content-Length') || 0);
          totalByName[url] = total;
          const reader = resp.body.getReader();
          const chunks = [];
          let loaded = 0;
          const tick = () => {
            reader.read().then(({ done, value }) => {
              if (done) {
                const buf = new Uint8Array(loaded);
                let off = 0;
                for (const c of chunks) { buf.set(c, off); off += c.length; }
                loadedByName[url] = loaded;
                updateProgress();
                resolve(buf);
                return;
              }
              chunks.push(value);
              loaded += value.length;
              loadedByName[url] = loaded;
              updateProgress();
              tick();
            }).catch(reject);
          };
          tick();
        }).catch(reject);
      });
    }
    const loadedByName = {};
    const totalByName = {};
    async function loadDataParts() {
      if (dataCache) return dataCache;
      headRight.textContent = 'loading 0%';
      const parts = [];
      for (const f of MODEL_FILES) {
        parts.push(await fetchWithProgress(f.name));
      }
      const dataTotal = parts.reduce((a, b) => a + b.length, 0);
      const merged = new Uint8Array(dataTotal);
      let offset = 0;
      for (const p of parts) { merged.set(p, offset); offset += p.length; }
      dataCache = merged.buffer;
      progFill.style.width = '100%';
      headRight.textContent = 'client-side';
      return dataCache;
    }
    function updateProgress() {
      let loaded = 0, total = 0;
      for (const f of MODEL_FILES) {
        loaded += loadedByName[f.name] || 0;
        total += totalByName[f.name] || 0;
      }
      const pct = total ? Math.round(loaded / total * 100) : 0;
      progFill.style.width = pct + '%';
      headRight.textContent = 'loading ' + pct + '%';
    }
    const origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && url.endsWith('hindi2hinglish-swift.data')) {
        return loadDataParts().then(buf => new Response(buf, {
          status: 200,
          headers: { 'Content-Length': String(buf.byteLength) },
        }));
      }
      return origFetch(url, opts);
    };
  </script>
  <script src="sherpa-onnx-wasm-main-asr.js"></script>
  <script src="sherpa-onnx-asr.js"></script>
  <script>
    const expectedSampleRate = 16000;
    const holdBtn = document.getElementById('hold');
    const transcriptEl = document.getElementById('transcript');
    const playBtn = document.getElementById('playBtn');
    const modeBtn = document.getElementById('modeBtn');
    const threadInfo = document.getElementById('threadInfo');

    let recognizer = null;
    let denoiser = null;
    let audioCtx = null;
    let playCtx = null;
    let playSource = null;
    let mediaStream = null;
    let recorder = null;
    let samples = [];
    let lastSamples = null;
    let recording = false;
    let pressed = false;
    let busy = false;
    let initialized = false;
    let denoise = false;

    const numThreads = Math.min(navigator.hardwareConcurrency || 4, 8);
    threadInfo.textContent = numThreads + 't' + (crossOriginIsolated ? '' : '·1t');
    if (!crossOriginIsolated) threadInfo.textContent = '1t';

    function setTranscript(text, placeholder) {
      transcriptEl.textContent = text;
      transcriptEl.classList.toggle('placeholder', !!placeholder);
    }
    function setPlayback(samples) {
      stopPlayback();
      if (!samples || samples.length < expectedSampleRate / 4) {
        lastSamples = null;
        playBtn.disabled = true;
        playBtn.textContent = '';
        return;
      }
      lastSamples = samples;
      playBtn.disabled = false;
      playBtn.textContent = 'play ' + (samples.length / expectedSampleRate).toFixed(1) + 's';
    }

    function stopPlayback() {
      if (playSource) {
        try { playSource.stop(); } catch (e) {}
        playSource.disconnect();
        playSource = null;
      }
      playBtn.classList.remove('playing');
      if (lastSamples) playBtn.textContent = 'play ' + (lastSamples.length / expectedSampleRate).toFixed(1) + 's';
    }

    playBtn.addEventListener('click', function() {
      if (!lastSamples) return;
      if (playSource) { stopPlayback(); return; }
      try {
        if (!playCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          playCtx = new AC();
        }
        if (playCtx.state === 'suspended') playCtx.resume();
        const buf = playCtx.createBuffer(1, lastSamples.length, expectedSampleRate);
        buf.copyToChannel(lastSamples instanceof Float32Array ? lastSamples : new Float32Array(lastSamples), 0);
        const source = playCtx.createBufferSource();
        source.buffer = buf;
        source.connect(playCtx.destination);
        source.onended = () => {
          playSource = null;
          playBtn.classList.remove('playing');
          if (lastSamples) playBtn.textContent = 'play ' + (lastSamples.length / expectedSampleRate).toFixed(1) + 's';
        };
        source.start();
        playSource = source;
        playBtn.classList.add('playing');
        playBtn.textContent = 'stop';
      } catch (err) {
        console.error(err);
        playSource = null;
        playBtn.classList.remove('playing');
        if (lastSamples) playBtn.textContent = 'play ' + (lastSamples.length / expectedSampleRate).toFixed(1) + 's';
      }
    });

    function makeDenoiser() {
      const Module = window.Module;
      const freeConfig = function(config) {
        if ('buffer' in config) Module._free(config.buffer);
        if ('config' in config) freeConfig(config.config);
        if ('gtcrn' in config) freeConfig(config.gtcrn);
        if ('dpdfnet' in config) freeConfig(config.dpdfnet);
        Module._free(config.ptr);
      };
      const initDpdf = function(config) {
        const modelLen = Module.lengthBytesUTF8(config.model) + 1;
        const buffer = Module._malloc(modelLen);
        const ptr = Module._malloc(4);
        Module.stringToUTF8(config.model, buffer, modelLen);
        Module.setValue(ptr, buffer, 'i8*');
        return { buffer, ptr, len: 4 };
      };
      const initModelCfg = function(config) {
        if (!('gtcrn' in config)) config.gtcrn = { model: '' };
        if (!('dpdfnet' in config)) config.dpdfnet = { model: '' };
        const gtcrn = initDpdf(config.gtcrn);
        const dpdfnet = initDpdf(config.dpdfnet);
        const len = gtcrn.len + 3 * 4 + dpdfnet.len;
        const ptr = Module._malloc(len);
        let o = 0;
        Module._CopyHeap(gtcrn.ptr, gtcrn.len, ptr + o); o += gtcrn.len;
        Module.setValue(ptr + o, config.numThreads || 1, 'i32'); o += 4;
        Module.setValue(ptr + o, config.debug || 0, 'i32'); o += 4;
        const providerLen = Module.lengthBytesUTF8(config.provider || 'cpu') + 1;
        const buffer = Module._malloc(providerLen);
        Module.stringToUTF8(config.provider || 'cpu', buffer, providerLen);
        Module.setValue(ptr + o, buffer, 'i8*'); o += 4;
        Module._CopyHeap(dpdfnet.ptr, dpdfnet.len, ptr + o);
        return { buffer, ptr, len, gtcrn, dpdfnet };
      };
      const initDenCfg = function(config) {
        if (!('model' in config)) config.model = { gtcrn: { model: '' }, dpdfnet: { model: '' }, provider: 'cpu', debug: 0, numThreads: 1 };
        const modelConfig = initModelCfg(config.model);
        const ptr = Module._malloc(modelConfig.len);
        Module._CopyHeap(modelConfig.ptr, modelConfig.len, ptr);
        return { ptr, len: modelConfig.len, config: modelConfig };
      };
      const copyDenoisedAudio = function(handle) {
        const n = Module.HEAP32[handle / 4 + 1];
        const sr = Module.HEAP32[handle / 4 + 2];
        const sp = Module.HEAP32[handle / 4] / 4;
        const out = new Float32Array(n);
        for (let i = 0; i < n; i++) out[i] = Module.HEAPF32[sp + i];
        Module._SherpaOnnxDestroyDenoisedAudio(handle);
        return { samples: out, sampleRate: sr };
      };
      return {
        handle: (function() {
          const cfg = { model: { dpdfnet: { model: '/dpdfnet4.onnx' }, numThreads: 1, debug: 0, provider: 'cpu' } };
          const c = initDenCfg(cfg);
          const h = Module._SherpaOnnxCreateOfflineSpeechDenoiser(c.ptr);
          freeConfig(c);
          return h;
        })(),
        run: function(samples, sampleRate) {
          const ptr = Module._malloc(samples.length * 4);
          Module.HEAPF32.set(samples, ptr / 4);
          const h = Module._SherpaOnnxOfflineSpeechDenoiserRun(this.handle, ptr, samples.length, sampleRate);
          Module._free(ptr);
          return copyDenoisedAudio(h);
        },
        free: function() { Module._SherpaOnnxDestroyOfflineSpeechDenoiser(this.handle); },
      };
    }

    function denoiseSamples(samples) {
      if (!denoiser) denoiser = makeDenoiser();
      const out = denoiser.run(samples, expectedSampleRate);
      denoiser.free();
      denoiser = null;
      return out.samples;
    }

    Module.onRuntimeInitialized = function() {
      const config = {
        featConfig: { sampleRate: 16000, featureDim: 80 },
        modelConfig: {
          debug: 0,
          tokens: 'tokens.txt',
          whisper: { encoder: 'whisper-encoder.onnx', decoder: 'whisper-decoder.onnx' },
        },
        decodingMethod: 'greedy_search',
        numThreads: numThreads,
      };
      try {
        recognizer = new OfflineRecognizer(config, Module);
        initialized = true;
        holdBtn.disabled = false;
        modeBtn.disabled = false;
        modeBtn.textContent = denoise ? 'asr+dn' : 'asr';
        setTranscript('hold to talk', true);
      } catch (err) {
        console.error(err);
        setTranscript('error: ' + err.message, true);
      }
    };

    function downsampleBuffer(buffer, exportSampleRate) {
      if (exportSampleRate === audioCtx.sampleRate) return buffer;
      const sampleRateRatio = audioCtx.sampleRate / exportSampleRate;
      const newLength = Math.round(buffer.length / sampleRateRatio);
      const result = new Float32Array(newLength);
      let offsetResult = 0, offsetBuffer = 0;
      while (offsetResult < result.length) {
        let nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) { accum += buffer[i]; count++; }
        result[offsetResult] = accum / count;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function startRecording() {
      if (!initialized || busy || recording) return;
      pressed = true;
      holdBtn.classList.add('recording');
      holdBtn.textContent = 'release';
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        if (!pressed) {
          stream.getTracks().forEach(t => t.stop());
          holdBtn.classList.remove('recording');
          holdBtn.textContent = 'hold';
          return;
        }
        mediaStream = stream;
        audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(stream);
        recorder = audioCtx.createScriptProcessor(4096, 1, 1);
        samples = [];
        recorder.onaudioprocess = function(e) {
          if (!recording) return;
          let chunk = new Float32Array(e.inputBuffer.getChannelData(0));
          chunk = downsampleBuffer(chunk, expectedSampleRate);
          for (let i = 0; i < chunk.length; i++) samples.push(chunk[i]);
        };
        source.connect(recorder);
        recorder.connect(audioCtx.destination);
        recording = true;
      }).catch(function(err) {
        console.error(err);
        holdBtn.classList.remove('recording');
        holdBtn.textContent = 'hold';
        setTranscript('mic denied: ' + err.message, true);
      });
    }

    function stopRecording() {
      pressed = false;
      if (!recording) return;
      recording = false;
      holdBtn.classList.remove('recording');
      holdBtn.textContent = 'hold';
      try { recorder.disconnect(); } catch (e) {}
      try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
      if (samples.length < expectedSampleRate) {
        setPlayback(samples);
        setTranscript('too short', true);
        return;
      }
      setPlayback(samples);
      setTranscript('…', true);
      busy = true;
      setTimeout(function() {
        try {
          const audio = new Float32Array(samples);
          const input = denoise ? denoiseSamples(audio) : audio;
          const stream = recognizer.createStream();
          stream.acceptWaveform(expectedSampleRate, input);
          recognizer.decode(stream);
          const result = recognizer.getResult(stream);
          stream.free();
          const text = result.text.trim();
          setTranscript(text || 'no speech', !!text ? false : true);
        } catch (err) {
          console.error(err);
          setTranscript('error: ' + err.message, true);
        }
        busy = false;
      }, 50);
    }

    holdBtn.addEventListener('pointerdown', function(e) { e.preventDefault(); startRecording(); });
    holdBtn.addEventListener('pointerup', function(e) { e.preventDefault(); stopRecording(); });
    holdBtn.addEventListener('pointerleave', function(e) { if (recording) stopRecording(); });
    holdBtn.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!e.repeat) startRecording();
      }
    });
    window.addEventListener('keyup', function(e) {
      if (e.code === 'Space') { e.preventDefault(); stopRecording(); }
    });
    window.addEventListener('blur', function() { stopRecording(); });

    modeBtn.addEventListener('click', function() {
      denoise = !denoise;
      modeBtn.textContent = denoise ? 'asr+dn' : 'asr';
    });
    window.__h2hTest = { denoiseSamples, decodeSamples: function(input) {
      const stream = recognizer.createStream();
      stream.acceptWaveform(expectedSampleRate, new Float32Array(input));
      recognizer.decode(stream);
      const result = recognizer.getResult(stream);
      stream.free();
      return result.text.trim();
    }, getState: function() { return { initialized, denoise, lastSamples: lastSamples && lastSamples.length, numThreads }; } };
  </script>
</body>
</html>
